[agents]
max_concurrent_threads_per_session = 4
interrupt_message = true

[agents.analyst]
description = "Leitet aus einer FACIS-DCS-Anforderung prüfbare Akzeptanzkriterien und Traceability ab; arbeitet ausschließlich lesend."
config_file = "agents/analyst.toml"

[agents.architekt]
description = "Prüft Akzeptanzkriterien gegen die FACIS-DCS-Architektur und liefert Architektur- sowie Feasibility-Gate; arbeitet lesend."
config_file = "agents/architekt.toml"

[agents."gherkin-autor"]
description = "Schreibt rote Behave/Gherkin-Spezifikationen und DCS-spezifische Steps für freigegebene BDD-Akzeptanzkriterien."
config_file = "agents/gherkin-autor.toml"

[agents.implementierer]
description = "Implementiert freigegebene FACIS-DCS-Akzeptanzkriterien im Produktivcode und ergänzt Unit-Tests, ohne BDD-Spezifikationen umzuschreiben."
config_file = "agents/implementierer.toml"

[agents.verifier]
description = "Verifiziert Tests und die Abdeckung jedes Akzeptanzkriteriums unabhängig und streng; arbeitet ausschließlich lesend."
config_file = "agents/verifier.toml"

[agents.revisor]
description = "Härtet eine grün verifizierte Umsetzung durch Requirements-Gegencheck, bestätigte Obsoleszenzbereinigung und verhaltensneutrales Refactoring."
config_file = "agents/revisor.toml"

[agents.dokumentierer]
description = "Dokumentiert eine vollständig verifizierte und revidierte FACIS-DCS-Umsetzung ausschließlich unter docs/."
config_file = "agents/dokumentierer.toml"

[agents."ui-analyst"]
description = "Analysiert FACIS-DCS-UI-Probleme, Nutzerflüsse, Accessibility und responsive Zustände ausschließlich lesend."
config_file = "agents/ui-analyst.toml"

[agents."ui-implementierer"]
description = "Implementiert freigegebene FACIS-DCS-UI-Verbesserungen und direkt gekoppelte Full-Stack-Korrekturen mit fokussierten Tests."
config_file = "agents/ui-implementierer.toml"

[agents."ui-verifier"]
description = "Verifiziert UI-Akzeptanzkriterien unabhängig über Code, Frontend-Gates, Browserzustände, Accessibility und Breakpoints; arbeitet lesend."
config_file = "agents/ui-verifier.toml"
