image:
  repository: ipfs/kubo
  # Pinned deliberately. A mutable tag meant a node could change version between
  # two pulls of the same release, and an IPFS node that stops accepting writes
  # takes signing down with it: the regenerator holds the per-contract lock
  # across its store write, so a stalled pin surfaces as "PDF is still being
  # regenerated" on the signing path.
  tag: "v0.32.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # IPFS HTTP Gateway (read)
  gatewayPort: 8080
  gatewayNodePort: null
  # IPFS RPC API (write)
  apiPort: 5001
  apiNodePort: null
  # Swarm (peer-to-peer) – usually not needed for dev
  swarmPort: 4001
  swarmNodePort: null

api:
  cors:
    enabled: false
    allowOrigins: []
    allowMethods:
      - POST
      - OPTIONS
    allowHeaders:
      - Content-Type
      - Authorization
    allowCredentials: true

persistence:
  enabled: false
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  # Empty uses the cluster default StorageClass. Set an encrypted class per
  # environment; the Kubo repo stores all pinned artifact ciphertext.
  storageClassName: ""

resources: {}
