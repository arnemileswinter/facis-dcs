image:
  repository: nats
  tag: "2.10-alpine"
  # Optional "sha256:<hex>": pulls <repository>:<tag>@<digest>.
  digest: ""
  pullPolicy: IfNotPresent

# The image has no user of its own; nats-server runs as 1000. JetStream keeps
# its store in /tmp/nats (emptyDir) (DCS-NFR-SEC-05).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 4222
  nodePort: null

resources: {}
