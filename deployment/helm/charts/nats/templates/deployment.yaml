{{- $tls := dig "internalTLS" "enabled" false (.Values.global | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $tls }}
          # Clients must use TLS 1.3 (DCS-NFR-SEC-14).
          args: ["-js", "-c", "/etc/nats/nats.conf"]
          volumeMounts:
            - name: internal-tls
              mountPath: /etc/dcs-internal-tls
              readOnly: true
            - name: config
              mountPath: /etc/nats
              readOnly: true
          {{- else }}
          args: ["-js"]
          {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if $tls }}
      volumes:
        - name: internal-tls
          secret:
            secretName: {{ .Release.Name }}-internal-tls
        - name: config
          configMap:
            name: {{ .Release.Name }}-nats
      {{- end }}
