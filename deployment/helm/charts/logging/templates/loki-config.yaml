{{- $tls := dig "internalTLS" "enabled" false (.Values.global | default dict) }}
{{- $name := printf "%s-loki" .Release.Name }}
# Log store (DCS-NFR-SEC-09). Single binary, filesystem storage, retention by
# the compactor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      {{- if $tls }}
      tls_min_version: VersionTLS13
      http_tls_config:
        cert_file: /etc/dcs-internal-tls/tls.crt
        key_file: /etc/dcs-internal-tls/tls.key
      {{- end }}
    common:
      path_prefix: /var/loki
      replication_factor: 1
      instance_addr: 127.0.0.1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: {{ .Values.retention }}
    analytics:
      reporting_enabled: false
