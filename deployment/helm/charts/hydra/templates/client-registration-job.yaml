{{- if .Values.clients }}
{{- $tls := dig "internalTLS" "enabled" false (.Values.global | default dict) }}
{{/*
Registers OAuth2 clients in Hydra via the admin API after every install/upgrade.
Idempotent: uses PUT (upsert) so re-running on upgrade is safe.
*/}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-hydra-clients
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register-clients
          image: "{{ .Values.jobImage.repository }}:{{ .Values.jobImage.tag }}{{ with .Values.jobImage.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.jobImage.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with (.Values.jobResources | default .Values.resources) }}
          # Its own pod, so this block does not overlap the server's. Without one
          # a LimitRange default applies and the hook is refused on a namespace
          # whose limits.cpu quota the release already consumes.
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if $tls }}
            # The admin API over TLS 1.3, verified against the internal CA.
            - name: HYDRA_ADMIN
              value: https://{{ .Release.Name }}-hydra:{{ .Values.global.internalTLS.proxy.port }}
            - name: CURL_CA_BUNDLE
              value: /etc/dcs-internal-tls/ca.crt
            {{- else }}
            - name: HYDRA_ADMIN
              value: http://{{ .Release.Name }}-hydra:{{ .Values.service.adminPort }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for Hydra admin API..."
              until curl -sf $HYDRA_ADMIN/health/ready >/dev/null; do sleep 3; done
              echo "Hydra ready."

              {{- range .Values.clients }}
              echo "Registering client {{ .client_id }}..."
              PAYLOAD={{ . | toJson | squote }}
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                $HYDRA_ADMIN/admin/clients/{{ .client_id }})
              if [ "$STATUS" = "200" ]; then
                curl -sf -X PUT $HYDRA_ADMIN/admin/clients/{{ .client_id }} \
                  -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null
              else
                curl -sf -X POST $HYDRA_ADMIN/admin/clients \
                  -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null
              fi
              echo "Client {{ .client_id }} done."
              {{- end }}
          {{- if $tls }}
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/dcs-internal-tls
              readOnly: true
      volumes:
        - name: internal-ca
          secret:
            secretName: {{ .Release.Name }}-internal-tls
            items:
              - key: ca.crt
                path: ca.crt
          {{- end }}
{{- end }}
