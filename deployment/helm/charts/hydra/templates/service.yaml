apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hydra
  {{- if dig "internalTLS" "enabled" false (.Values.global | default dict) }}
  {{- with include "digital-contracting-service.traefikServersTransportAnnotation" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: public
      port: {{ .Values.service.publicPort }}
      targetPort: public
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.publicNodePort }}
      nodePort: {{ .Values.service.publicNodePort }}
      {{- end }}
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.adminNodePort }}
      nodePort: {{ .Values.service.adminNodePort }}
      {{- end }}
    {{- if dig "internalTLS" "enabled" false (.Values.global | default dict) }}
    {{- include "digital-contracting-service.internalTLSServicePort" . | nindent 4 }}
    # The ingress reaches the public API over TLS 1.3 here.
    - name: https-public
      port: {{ .Values.service.publicTLSPort }}
      targetPort: https-public
      protocol: TCP
    {{- end }}
  selector:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: {{ .Release.Name }}
