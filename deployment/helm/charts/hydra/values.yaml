image:
  repository: oryd/hydra
  tag: "v2.2.0"
  # Optional "sha256:<hex>": pulls <repository>:<tag>@<digest>.
  digest: ""
  pullPolicy: IfNotPresent

# 100:101 is the ory user of the Hydra image. Hydra writes no files: its state
# is in the database of config.dsn (DCS-NFR-SEC-05).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Image of the client registration job: it needs sh and curl. It runs as UID
# 65532 on a read-only root filesystem.
jobImage:
  repository: alpine/k8s
  tag: "1.33.4"
  digest: "sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  publicPort: 4444
  adminPort: 4445
  publicNodePort: null
  adminNodePort: null

config:
  # For production, use a persistent DSN (for example PostgreSQL).
  dsn: "memory"
  # REQUIRED: public-facing base URL browsers use to reach Hydra (e.g. https://dcs.example.com).
  # Hydra stamps this into every redirect_to URL it returns, so it must be externally reachable.
  # Route Hydra's public paths (/oauth2, /.well-known) through the parent ingress via route.paths.
  selfIssuerURL: ""
  internalIssuerURL: ""
  loginURL: ""
  consentURL: ""
  logoutURL: ""
  publicTLS: false
  adminTLS: false
  # Lifetime of an access token (Hydra ttl.access_token, e.g. "5m"). Empty
  # keeps the Hydra default of 1h. A revoked credential ends the session at
  # the next token refresh, so this is the longest time an access token issued
  # before a revocation stays valid (DCS-IR-CI-09, DCS-NFR-BR-06).
  accessTokenTTL: ""
  # Enable Hydra dev mode (required when selfIssuerURL uses http://).
  # Never set to true in production.
  dev: false

# Paths on the parent chart's ingress to proxy to Hydra's public port.
# The parent ingress must be enabled (ingress.enabled=true) for these to take effect.
route:
  paths:
    - /oauth2
    - /.well-known

secrets:
  # Hydra's system secret. Outside dev mode, systemSecretRef is required and
  # the chart refuses to render without it. `system` (inline) applies in dev
  # mode only, with a fixed placeholder as fallback.
  system: ""
  systemSecretRef:
    name: ""
    key: secretsSystem

resources: {}

# Sizes the client-registration hook Job, a separate pod from the server. Falls
# back to `resources` when unset; set it on namespaces with a limits.cpu quota,
# where an unsized hook inherits the LimitRange default and is refused once the
# release's own containers consume the quota.
jobResources: {}
