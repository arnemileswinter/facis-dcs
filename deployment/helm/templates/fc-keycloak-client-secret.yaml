{{- if .Values.fcservice.enabled }}
# fc-service references Secret fc-keycloak-client-secret/keycloak_client_secret
# (KEYCLOAK_CREDENTIALS_SECRET env, see values' fcservice.env) but nothing in
# the vendored chart creates it. The value is the literal placeholder
# ("**********") committed in fc-realm.json's `federated-catalogue` client —
# confirmed live against the real (unmasked) Admin API /client-secret
# response that Keycloak's import takes it at face value, not a real secret
# to generate or rotate.
apiVersion: v1
kind: Secret
metadata:
  name: fc-keycloak-client-secret
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak_client_secret: {{ .Values.fcservice.realmProvision.clientSecret | quote }}
{{- end }}
