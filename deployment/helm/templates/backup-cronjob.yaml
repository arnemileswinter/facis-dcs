{{- if .Values.backup.enabled -}}
{{- $name := printf "%s-db-backup" (include "digital-contracting-service.fullname" .) -}}
{{- $claim := .Values.backup.persistence.existingClaim | default $name -}}
# Scheduled dump of the DCS database (DCS-NFR-SF-03). The dcs database holds the
# only copy of the wrapped content keys, so it is the backup that decides
# whether the archive can be restored: docs/backup-integration-guide.md. Each run
# writes one pg_dump custom-format file and deletes the files older than
# backup.retentionDays. The retention is part of the erasure guarantee (guide,
# section 4.1).
{{- if not .Values.backup.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
  annotations:
    # The dumps must outlive an uninstall of the release.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
  {{- with .Values.backup.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $name }}
        spec:
          restartPolicy: Never
          securityContext:
            # The postgres user of the postgres image.
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # The pg_dump major version must be at least the server's.
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}{{ with .Values.backup.image.digest }}@{{ . }}{{ end }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              # Writes only to /backup.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                {{- include "digital-contracting-service.databaseEnv" . | nindent 16 }}
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  file="/backup/dcs-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --dbname="$DATABASE_URL" --file="$file.partial"
                  mv "$file.partial" "$file"
                  echo "wrote $file ($(wc -c < "$file") bytes)"
                  find /backup -name 'dcs-*.dump' -mtime +"$RETENTION_DAYS" -print -delete
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                {{- if .Values.global.internalTLS.enabled }}
                {{- include "digital-contracting-service.internalCAVolumeMount" . | nindent 16 }}
                {{- end }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ $claim }}
            {{- if .Values.global.internalTLS.enabled }}
            {{- include "digital-contracting-service.internalCAVolume" . | nindent 12 }}
            {{- end }}
{{- end }}
