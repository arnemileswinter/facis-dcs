{{- if and .Values.alerts.enabled (or .Values.monitoring.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule")) }}
{{- $fullname := include "digital-contracting-service.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $sel := printf "namespace=%q, service=%q" $ns (printf "%s-metrics" $fullname) }}
# Alert rules for continuous monitoring (DCS-NFR-SEC-11). Alertmanager routes
# them; the liveness probe restarts a backend that stops serving.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ $fullname }}
      rules:
        - alert: DCSBackendDown
          expr: up{ {{- $sel -}} } == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "A DCS backend in {{ $ns }} does not answer the metrics scrape."
        - alert: DCSServerErrors
          expr: |
            sum(rate(http_requests_total{ {{- $sel -}}, status=~"5.."}[5m]))
              / sum(rate(http_requests_total{ {{- $sel -}} }[5m])) > {{ .Values.alerts.serverErrorRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "More than {{ mulf .Values.alerts.serverErrorRatio 100 }}% of DCS requests in {{ $ns }} fail with 5xx."
        - alert: DCSAuthFailureSpike
          # Many refused requests can be a credential-guessing or token-replay attempt.
          expr: sum(rate(http_requests_total{ {{- $sel -}}, status=~"401|403"}[5m])) > {{ .Values.alerts.authFailuresPerSecond }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "DCS in {{ $ns }} refuses more than {{ .Values.alerts.authFailuresPerSecond }} requests per second (401/403)."
        - alert: DCSSlowResponses
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{ {{- $sel -}} }[5m]))) > {{ .Values.alerts.p95LatencySeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The 95th percentile DCS response time in {{ $ns }} is above {{ .Values.alerts.p95LatencySeconds }}s."
        - alert: DCSBackendRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace={{ $ns | quote }}, pod=~{{ printf "%s-[a-z0-9]+-[a-z0-9]+" $fullname | quote }}}[30m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "A DCS backend pod in {{ $ns }} restarted more than twice in 30 minutes."
        {{- if .Values.backup.enabled }}
        - alert: DCSBackupFailed
          expr: kube_job_status_failed{namespace={{ $ns | quote }}, job_name=~{{ printf "%s-db-backup-.*" $fullname | quote }}} > 0
          labels:
            severity: critical
          annotations:
            summary: "The DCS database backup job in {{ $ns }} failed (DCS-NFR-SF-03)."
        {{- end }}
{{- end }}
