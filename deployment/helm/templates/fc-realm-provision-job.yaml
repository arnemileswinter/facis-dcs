{{- if and .Values.fcservice.enabled .Values.fcservice.realmProvision.enabled }}
# fc-service's own boot-time `--import-realm` hits a confirmed, unresolved
# upstream Keycloak bug for realm files of this size (silent exit partway
# through import, no error at any log level — see keycloak/keycloak#37745).
# We disable --import-realm (see values' fcservice.keycloak.args) and do the
# same import via the Admin REST API instead, which doesn't hit the bug.
# Also assigns the SCHEMA_*/ASSET_* realm roles fc-service-server's
# controllers require (confirmed via SchemaControllerTest.java) that
# fc-realm.json's import doesn't include.
#
# No k8s API access needed (no custom ServiceAccount/RBAC either) — this
# used to also patch fc-service's/fc-demo-portal's issuer env vars via the
# k8s API, working around the OLD vendored fc-service chart hardcoding them
# to an unreachable URL after `.Values.env` (values-level overrides lost).
# charts/federated-catalogue (our own chart, replacing the vendored one)
# computes the correct issuer directly from values instead, so that patch
# step became actively harmful: it kept overwriting the chart's already-
# correct value with a stale internal-only one, 401ing every DCS→FC call
# again after every sync (confirmed live).
#
# Idempotent; runs on every install/upgrade. No --wait on the helm invocation
# (see tests/bdd/Makefile's kind_deploy) — Helm hooks don't gate on
# Deployment readiness, so this isn't blocked by fc-service/fc-demo-portal
# not yet being Ready (matches the same reasoning as hsm-provision-job.yaml's
# devCertChain deadlock note).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}-fc-realm-provision
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "digital-contracting-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fc-realm-provision
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fc-realm-provision
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: KC_BASE_URL
              value: {{ printf "http://%s:8080/auth" .Values.fcservice.realmProvision.keycloakHost | quote }}
            - name: KC_ADMIN_USER
              value: {{ .Values.fcservice.realmProvision.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              value: {{ .Values.fcservice.realmProvision.adminPassword | quote }}
            - name: REALM
              value: {{ .Values.fcservice.keycloak.realm | quote }}
            - name: FC_CLIENT_UUID
              value: {{ .Values.fcservice.realmProvision.serviceAccountUserID | quote }}
          volumeMounts:
            - name: realm-config
              mountPath: /realm
              readOnly: true
          command:
            - /bin/bash
            - -c
            - |
              set -eu

              # fc-keycloak takes a while to come up (Quarkus augmentation);
              # helm runs this hook without waiting for Deployment readiness,
              # so retry until it actually answers.
              echo "Waiting for $KC_BASE_URL ..."
              for i in $(seq 1 60); do
                # KC_PROXY_HEADERS=xforwarded + master realm's default
                # sslRequired=EXTERNAL means Keycloak 403s any request that
                # lacks this header, even the read-only well-known endpoint —
                # confirmed live against IONOS's fc-keycloak (curl -sf without
                # it returns 403, never 200, so this loop never detects "up"
                # and the Job always fails via BackoffLimitExceeded).
                if curl -sf -o /dev/null -H "X-Forwarded-Proto: https" "$KC_BASE_URL/realms/master/.well-known/openid-configuration"; then
                  echo "Keycloak is up."
                  break
                fi
                if [ "$i" = "60" ]; then echo "Keycloak never came up." >&2; exit 1; fi
                sleep 5
              done

              admin_token() {
                curl -sf -X POST "$KC_BASE_URL/realms/master/protocol/openid-connect/token" \
                  -H "X-Forwarded-Proto: https" \
                  -d "grant_type=password" -d "client_id=admin-cli" \
                  -d "username=$KC_ADMIN_USER" -d "password=$KC_ADMIN_PASSWORD" \
                  | jq -r .access_token
              }
              TOKEN="$(admin_token)"

              REALM_STATUS="$(curl -s -o /dev/null -w '%{http_code}' -H "X-Forwarded-Proto: https" \
                -H "Authorization: Bearer $TOKEN" "$KC_BASE_URL/admin/realms/$REALM")"
              if [ "$REALM_STATUS" = "200" ]; then
                echo "Realm $REALM already imported — skipping (idempotent)."
              else
                echo "Importing realm $REALM via Admin API (boot-time --import-realm is disabled, see keycloak/keycloak#37745)..."
                curl -sf -X POST "$KC_BASE_URL/admin/realms" \
                  -H "X-Forwarded-Proto: https" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  --data-binary @/realm/fc-realm.json
                curl -sf -X PUT "$KC_BASE_URL/admin/realms/$REALM" \
                  -H "X-Forwarded-Proto: https" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  --data '{"sslRequired":"NONE"}'
                echo "Realm imported."
              fi

              # fc-service-server's controllers require these realm roles
              # (SchemaControllerTest.java) — fc-realm.json's import doesn't
              # define them at all.
              ROLE_IDS=""
              for ROLE in SCHEMA_READ SCHEMA_CREATE SCHEMA_DELETE ASSET_READ ASSET_CREATE ASSET_DELETE; do
                TOKEN="$(admin_token)"
                curl -s -o /dev/null -X POST -H "X-Forwarded-Proto: https" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  "$KC_BASE_URL/admin/realms/$REALM/roles" --data "{\"name\":\"$ROLE\"}" || true
              done

              TOKEN="$(admin_token)"
              ROLE_REPS="$(curl -sf -H "X-Forwarded-Proto: https" -H "Authorization: Bearer $TOKEN" \
                "$KC_BASE_URL/admin/realms/$REALM/roles" \
                | jq -c '[.[] | select(.name | test("^(SCHEMA_|ASSET_)"))]')"

              echo "Assigning roles to service-account-federated-catalogue..."
              curl -sf -o /dev/null -X POST -H "X-Forwarded-Proto: https" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                "$KC_BASE_URL/admin/realms/$REALM/users/$FC_CLIENT_UUID/role-mappings/realm" \
                --data "$ROLE_REPS"

              echo "fc-realm-provision done."
      volumes:
        - name: realm-config
          configMap:
            name: fc-keycloak-realm-configmap
{{- end }}
