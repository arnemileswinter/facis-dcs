# Production profile skeleton (SRS §6 item 3). Layered on top of values.yaml
# (`helm install -f values.yaml -f values.prod.yml`). This is intentionally a
# skeleton, not a filled-in deployment: production hostnames, registry, and
# secret-manager wiring are the operator's to fill in per ADR-1's swap-config
# story (dev-CA ↔ real PKI, SoftHSM2 ↔ real HSM by configuration only).
#
# Differs from values.acceptance.yml in exactly one structural way: PKCS#11
# provisioning is OFF. Production does not co-deploy a SoftHSM2 token; it
# points at a real, pre-provisioned HSM's PKCS#11 module. Everything else
# (secretKeyRef-only credentials, ingress/TLS, Hydra caveat) is the same
# pattern as acceptance.

replicaCount: 3

image:
  repository: "[registry]/digital-contracting-service"
  tag: ""   # pin an explicit release tag in production, never blank/latest

route:
  basePath: "/digital-contracting-service"
  publicBaseURL: "https://dcs.example.org/digital-contracting-service"

ingress:
  enabled: true
  className: ""
  pathType: Prefix
  hosts:
    - host: dcs.example.org
      paths: []
  tls:
    - hosts: ["dcs.example.org"]
      secretName: dcs-prod-tls

  # DCS-IR-CI-01 / DCS-NFR-SEC-01: TLS 1.3 minimum. When the cluster's
  # controller is Traefik, the chart enforces it (ingress.tlsOptions, on by
  # default). For another controller, set the minimum on the controller and
  # verify it: deployment/README.md, "TLS".

database:
  url: ""
  secretRef:
    name: dcs-prod-db-credentials
    key: DATABASE_URL

# See values.acceptance.yml's comment: the Hydra system secret comes from a
# Kubernetes Secret; client secrets are injected via --set from your secret
# manager, never committed.
hydra:
  enabled: true
  secrets:
    systemSecretRef:
      name: dcs-prod-hydra-secrets
  config:
    dev: false
    selfIssuerURL: "https://dcs.example.org"
    loginURL: "https://dcs.example.org/ui/"
    consentURL: "https://dcs.example.org/api/auth/consent"
    logoutURL: "https://dcs.example.org/api/auth/logout-complete"
  clients: []

# PKCS#11: production points at a REAL, pre-provisioned HSM — no
# in-cluster SoftHSM2 token, no provisioning job. The HSM's module path,
# token label, and key labels (dcs-c2pa, dcs-did, dcs-vc, dcs-oid4vp-jar —
# see backend/internal/base/hsm; no contract-signing key, the DCS holds none)
# must already exist on the HSM before this release is installed; this chart
# does not create HSM keys in production.
pkcs11:
  modulePath: ""   # e.g. /usr/lib/pkcs11/real-hsm.so, mounted via an extra volume
  tokenLabel: ""
  pin: ""
  pinSecretRef:
    name: dcs-prod-hsm-pin
    key: PKCS11_PIN
  provisioning:
    enabled: false

# With provisioning disabled no job issues a C2PA x5chain, so the chain for the
# real HSM's dcs-c2pa key must be mounted into the backend out-of-band and its
# path set in signing.issuerX5ChainPath. The backend serves it on the status
# list and forwards it to pdf-core per request.

federatedCatalogue:
  enabled: true
  apiURL: ""
  secretRef:
    name: dcs-prod-fc-credentials
    key: FEDERATED_CATALOGUE_API_URL
  oauth:
    clientID: "dcs-fc-client"
    clientSecretSecretRef:
      name: dcs-prod-fc-credentials
      key: FEDERATED_CATALOGUE_CLIENT_SECRET

ipfs:
  enabled: true
  mfsBaseURLSecretRef:
    name: dcs-prod-ipfs-credentials
    key: IPFS_MFS_BASE_URL
  # Storage at rest (DCS-NFR-SEC-14): the Kubo repo persists all pinned
  # artifact ciphertext. Set your platform's encrypted StorageClass here —
  # deploy.sh then asserts the bound class. Left empty, the cluster default
  # applies and disk encryption becomes an operator prerequisite deploy.sh
  # cannot assert.
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""   # e.g. "encrypted-gp3" — your encrypted StorageClass

# Storage at rest for the components prod does NOT co-deploy: the external
# PostgreSQL server (database.url above) and the real HSM hold their own
# storage — encrypting them is an operator prerequisite outside this chart.
# If you co-deploy postgresql instead, set
# postgresql.persistence.storageClassName to an encrypted class as well.

# EU DSS validates the wallet-produced signature on /signature/submit (ADR-12,
# DCS-FR-SM-18). Without a DSS_URL the backend refuses every signature, so
# signing needs it. enabled deploys the in-cluster DSS; to validate against an
# existing DSS instead, set dss.url and enabled: false.
dss:
  enabled: true

# Daily dump of the DCS database (DCS-NFR-SF-03): docs/backup-integration-guide.md.
# Set persistence.storageClassName to an encrypted class.
backup:
  enabled: true
